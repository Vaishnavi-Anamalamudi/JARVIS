services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_POOL_MAX_SIZE: ${POSTGRES_POOL_MAX_SIZE}
      POSTGRES_POOL_MIN_IDLE: ${POSTGRES_POOL_MIN_IDLE}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS}
      REDIS_URL: redis://redis:6379
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PRODUCER_RETRIES: ${KAFKA_PRODUCER_RETRIES}
      ADAPTIVE_GATEWAY_SERVICE_NAME: ${ADAPTIVE_GATEWAY_SERVICE_NAME}
      ADAPTIVE_GATEWAY_API_VERSION: ${ADAPTIVE_GATEWAY_API_VERSION}
      ADAPTIVE_GATEWAY_ADMIN_ROLE_NAME: ${ADAPTIVE_GATEWAY_ADMIN_ROLE_NAME}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS}
      ADAPTIVE_GATEWAY_REDIS_KEY_PREFIX: ${ADAPTIVE_GATEWAY_REDIS_KEY_PREFIX}
      REDIS_SESSION_CACHE_TTL_MINUTES: ${REDIS_SESSION_CACHE_TTL_MINUTES}
      REDIS_TEMPORARY_STATS_TTL_MINUTES: ${REDIS_TEMPORARY_STATS_TTL_MINUTES}
      KAFKA_DEFAULT_TOPIC: ${KAFKA_DEFAULT_TOPIC}
      KAFKA_REQUEST_EVENTS_TOPIC: ${KAFKA_REQUEST_EVENTS_TOPIC}
      KAFKA_HEALTH_TOPIC: ${KAFKA_HEALTH_TOPIC}
      KAFKA_EVENT_SCHEMA_VERSION: ${KAFKA_EVENT_SCHEMA_VERSION}
      KAFKA_PUBLISH_TIMEOUT_MS: ${KAFKA_PUBLISH_TIMEOUT_MS}
      KAFKA_RETRY_DELAY_SECONDS: ${KAFKA_RETRY_DELAY_SECONDS}
      KAFKA_MAX_ATTEMPTS: ${KAFKA_MAX_ATTEMPTS}
      KAFKA_OUTBOX_BATCH_SIZE: ${KAFKA_OUTBOX_BATCH_SIZE}
      KAFKA_OUTBOX_POLL_INTERVAL_MS: ${KAFKA_OUTBOX_POLL_INTERVAL_MS}
      ADAPTIVE_LEARNING_METRIC_WINDOW_SECONDS: ${ADAPTIVE_LEARNING_METRIC_WINDOW_SECONDS}
      ADAPTIVE_LEARNING_AGGREGATION_INTERVAL_MS: ${ADAPTIVE_LEARNING_AGGREGATION_INTERVAL_MS}
      ADAPTIVE_LEARNING_MIN_REQUESTS_FOR_ADJUSTMENT: ${ADAPTIVE_LEARNING_MIN_REQUESTS_FOR_ADJUSTMENT}
      ADAPTIVE_LEARNING_BLOCKED_RATE_RELAX_THRESHOLD: ${ADAPTIVE_LEARNING_BLOCKED_RATE_RELAX_THRESHOLD}
      ADAPTIVE_LEARNING_ERROR_RATE_TIGHTEN_THRESHOLD: ${ADAPTIVE_LEARNING_ERROR_RATE_TIGHTEN_THRESHOLD}
      ADAPTIVE_LEARNING_MAX_ERROR_RATE_FOR_RELAXATION: ${ADAPTIVE_LEARNING_MAX_ERROR_RATE_FOR_RELAXATION}
      ADAPTIVE_LEARNING_STRICTNESS_ADJUSTMENT_STEP: ${ADAPTIVE_LEARNING_STRICTNESS_ADJUSTMENT_STEP}
      ADAPTIVE_LEARNING_MIN_STRICTNESS_FACTOR: ${ADAPTIVE_LEARNING_MIN_STRICTNESS_FACTOR}
      ADAPTIVE_LEARNING_MAX_STRICTNESS_FACTOR: ${ADAPTIVE_LEARNING_MAX_STRICTNESS_FACTOR}
      ANOMALY_LOOKBACK_MINUTES: ${ANOMALY_LOOKBACK_MINUTES}
      ANOMALY_MINIMUM_SAMPLES: ${ANOMALY_MINIMUM_SAMPLES}
      ANOMALY_Z_SCORE_THRESHOLD: ${ANOMALY_Z_SCORE_THRESHOLD}
      ANOMALY_THRESHOLD_STDDEV_MULTIPLIER: ${ANOMALY_THRESHOLD_STDDEV_MULTIPLIER}
      ANOMALY_EMA_ALPHA: ${ANOMALY_EMA_ALPHA}
      ANOMALY_DETECTION_INTERVAL_MS: ${ANOMALY_DETECTION_INTERVAL_MS}
      ANOMALY_STRICTNESS_INCREASE_STEP: ${ANOMALY_STRICTNESS_INCREASE_STEP}
      ANOMALY_MAX_STRICTNESS_FACTOR: ${ANOMALY_MAX_STRICTNESS_FACTOR}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  kafka-data:
